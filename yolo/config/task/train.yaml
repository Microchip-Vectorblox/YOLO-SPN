task: train

defaults:
  - validation: ../validation

epoch: 500

data:
  batch_size: 16
  equivalent_batch_size: 64
  image_size: ${image_size}
  cpu_num: ${cpu_num}
  shuffle: True
  pin_memory: True
  style: 0.5
  data_augment:
    Mosaic: 0
    MixUp: 0 
    RandomCrop: 0
    #RemoveOutliers: 1e-8
    HorizontalFlip: 0.0
    VerticalFlip: 0.0
    HorizontalVerticalFlip: 0.0
    RandomSunFlare: 0.5
    GaussianBlur: 0.5
    GaussianNoise: 0.5
    RandomBrightness: 0.5
    RandomContrast: 0.5
    CoarseDropout: 0.5


optimizer:
  type: SGD
  args:
    lr: 0.01
    weight_decay: 0.0001
    momentum: 0.937
    nesterov: true

loss:
  objective:
    BCELoss: 0.25 #0.5
    BoxLoss: 3.5 #7.5
    DFLoss: 0.5 #1.5
    SPPosLoss: 10.0 #14.0
    SPRotLoss: 20.0
    HeatLoss: 0.6 #0.0006
  aux:
    0.25
  matcher:
    iou: CIoU
    topk: 10
    factor:
      iou: 6.0
      cls: 0.5

scheduler:
  type: LinearLR
  warmup:
    epochs: 3.0
  args:
    total_iters: ${task.epoch}
    start_factor: 1
    end_factor: 0.01

ema:
  enable: true
  decay: 0.9999
